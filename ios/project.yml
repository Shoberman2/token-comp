name: Burnt
options:
  bundleIdPrefix: app.burnt
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_ALLOWED: "NO"
targets:
  Burnt:
    type: application
    platform: iOS
    sources:
      - path: Burnt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.burnt.ios
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: Burnt/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
